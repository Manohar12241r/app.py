{% extends "base.html" %}

{% block title %}
Add Bill
{% endblock %}

{% block content %}

<div class="form-container wide">

    <h1>
        Add Vegetable Supply Bill
    </h1>

    <p class="subtitle">
        Record vegetables supplied to a hotel.
    </p>


    <form method="POST">

        <label>
            Hotel *
        </label>

        <select name="hotel_id" required>

            <option value="">
                -- Select Hotel --
            </option>

            {% for hotel in hotels %}

                <option value="{{ hotel.id }}">

                    {{ hotel.name }}

                </option>

            {% endfor %}

        </select>


        {% if not hotels %}

        <div class="warning">

            No hotels available.

            <a href="{{ url_for('add_hotel') }}">
                Add a hotel first.
            </a>

        </div>

        {% endif %}


        <label>
            Bill Number *
        </label>

        <input
            type="text"
            name="bill_number"
            placeholder="Example: VM-0001"
            required
        >


        <label>
            Bill Date *
        </label>

        <input
            type="date"
            name="bill_date"
            value="{{ today }}"
            required
        >


        <h2>
            Vegetable Items
        </h2>


        <div id="items-container">

            <div class="bill-item">

                <input
                    type="text"
                    name="vegetable_name[]"
                    placeholder="Vegetable name"
                    required
                >

                <input
                    type="number"
                    name="quantity[]"
                    placeholder="Quantity"
                    min="0"
                    step="0.01"
                    required
                >

                <select name="unit[]">

                    <option value="kg">
                        Kg
                    </option>

                    <option value="quintal">
                        Quintal
                    </option>

                    <option value="bag">
                        Bag
                    </option>

                    <option value="piece">
                        Piece
                    </option>

                    <option value="box">
                        Box
                    </option>

                </select>


                <input
                    type="number"
                    name="rate[]"
                    placeholder="Rate"
                    min="0"
                    step="0.01"
                    required
                >

                <button
                    type="button"
                    class="remove-button"
                    onclick="removeItem(this)"
                >
                    Remove
                </button>

            </div>

        </div>


        <button
            type="button"
            class="secondary-button"
            onclick="addItem()"
        >
            + Add Vegetable
        </button>


        <label>
            Notes
        </label>

        <textarea
            name="notes"
            rows="4"
            placeholder="Optional notes..."
        ></textarea>


        <div class="form-buttons">

            <button type="submit">
                Save Bill
            </button>

            <a href="{{ url_for('dashboard') }}">
                Cancel
            </a>

        </div>

    </form>

</div>


<script>

function addItem() {

    const container =
        document.getElementById("items-container");

    const item =
        document.createElement("div");

    item.className = "bill-item";

    item.innerHTML = `

        <input
            type="text"
            name="vegetable_name[]"
            placeholder="Vegetable name"
            required
        >

        <input
            type="number"
            name="quantity[]"
            placeholder="Quantity"
            min="0"
            step="0.01"
            required
        >

        <select name="unit[]">

            <option value="kg">
                Kg
            </option>

            <option value="quintal">
                Quintal
            </option>

            <option value="bag">
                Bag
            </option>

            <option value="piece">
                Piece
            </option>

            <option value="box">
                Box
            </option>

        </select>

        <input
            type="number"
            name="rate[]"
            placeholder="Rate"
            min="0"
            step="0.01"
            required
        >

        <button
            type="button"
            class="remove-button"
            onclick="removeItem(this)"
        >
            Remove
        </button>
    `;

    container.appendChild(item);
}


function removeItem(button) {

    const container =
        document.getElementById("items-container");

    if (container.children.length > 1) {

        button.parentElement.remove();

    }

}

</script>

{% endblock %}
